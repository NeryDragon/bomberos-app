<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Bomberos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icono de Font Awesome para una "X" de cerrar en el modal -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b3/Cuerpo_General_de_Bomberos_Voluntarios_del_Per%C3%BA_escudo.png" alt="Logo CGBVP" class="logo">
            <h1>Sistema de Gestión de Bomberos</h1>
        </div>
    </header>

    <main class="container">
        <div class="search-section">
            <input type="text" id="search-input" placeholder="Buscar por Código CBP o Nombre..." class="search-input">
            <button id="search-button" class="search-button">Buscar</button>
            <select id="search-type" class="search-select">
                <option value="nombre">Nombre/Apellido</option>
                <option value="codigoCBP">Código CBP</option>
            </select>
        </div>

        <div id="results-container" class="results-container">
            <!-- Aquí se mostrarán los resultados de la búsqueda -->
            <p class="no-results" id="no-results-message">No hay bomberos para mostrar. Por favor, realiza una búsqueda.</p>
        </div>
    </main>

    <!-- Modal para detalles del bombero -->
    <div id="bombero-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-nombre-completo"></h2>
            <div id="modal-details-content">
                <!-- Detalles del bombero se cargarán aquí -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2023 Cuerpo General de Bomberos Voluntarios del Perú</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
